services:
  wpad:
    # Serves wpad.dat over HTTP so the library can exercise its PAC fetcher
    # against a real HTTP server (not the in-process :gen_tcp fixture).
    image: nginx:alpine
    container_name: vintage_net_proxy_wpad
    ports:
      - "18080:80"
    volumes:
      - ./wpad.dat:/usr/share/nginx/html/wpad.dat:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  proxy:
    # The actual HTTP proxy the WPAD will route external traffic through.
    # Not strictly needed for the library's integration tests (they only
    # verify the resolved descriptor), but useful for manual end-to-end
    # checks (curl through it, watch the access log).
    image: monokal/tinyproxy:latest
    container_name: vintage_net_proxy_tinyproxy
    ports:
      - "18888:8888"
    command: ANY
    restart: unless-stopped
