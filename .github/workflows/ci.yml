name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported (mix.exs says `~> 1.15`).
          - elixir: "1.15"
            otp: "26"
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          # Newer-OTP coverage: forward-compat smoke.
          - elixir: "1.18"
            otp: "28"
          - elixir: "1.19"
            otp: "29"

    steps:
      - uses: actions/checkout@v4

      - name: Install vintage_net system headers
        run: sudo apt-get update && sudo apt-get install -y libmnl-dev libnl-genl-3-dev

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Fetch deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  checks:
    # Format / unused deps / docs — only on the latest BEAM. These checks
    # aren't version-sensitive, so we don't fan them out across the matrix.
    name: Lint & docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install vintage_net system headers
        run: sudo apt-get update && sudo apt-get install -y libmnl-dev libnl-genl-3-dev

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Fetch deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused deps
        run: mix deps.unlock --check-unused

      - name: Build docs (ensures ex_doc renders cleanly)
        run: mix docs

  integration:
    name: Integration tests (dev/ stack)
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Install vintage_net system headers
        run: sudo apt-get update && sudo apt-get install -y libmnl-dev libnl-genl-3-dev

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-1.18-27-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-1.18-27-

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: build-${{ runner.os }}-1.18-27-${{ hashFiles('mix.lock') }}
          restore-keys: build-${{ runner.os }}-1.18-27-

      - name: Fetch deps
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Start dev stack
        run: docker compose -f dev/docker-compose.yml up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:18080/wpad.dat > /dev/null \
               && timeout 1 bash -c "</dev/tcp/localhost/18888" 2>/dev/null; then
              echo "services reachable"
              exit 0
            fi
            echo "waiting for services ($i/30)"
            sleep 1
          done
          echo "timeout waiting for dev stack"
          docker compose -f dev/docker-compose.yml ps
          docker compose -f dev/docker-compose.yml logs
          exit 1

      - name: Run integration tests
        run: mix test --only integration

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs

      - name: Tear down dev stack
        if: always()
        run: docker compose -f dev/docker-compose.yml down
